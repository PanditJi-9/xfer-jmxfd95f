name: os4-no-super-vendor-odm-dlkm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    env:
      WORK: /mnt/os4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space and prepare /mnt work dir
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/lib/node_modules /opt/microsoft /usr/share/swift \
            /usr/local/share/powershell /usr/share/miniconda /usr/lib/jvm /usr/local/go || true
          sudo apt-get clean
          sudo mkdir -p "$WORK"
          sudo chown -R "$USER:$USER" "$WORK"
          test -w "$WORK"
          df -h / "$WORK"

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unzip curl jq file coreutils
          mkdir -p tools
          curl -L --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 60 \
            -o tools/lptools.zip \
            "https://github.com/sekaiacg/lptools/releases/download/lptools-260109/lptools-260109-Linux_x86_64.zip"
          unzip -q tools/lptools.zip -d tools/lptools
          chmod +x tools/lptools/*
          ls -l tools/lptools
          tools/lptools/lpunpack 2>&1 | head -8 || true
          tools/lptools/simg2img 2>&1 | head -3 || true
          df -h / "$WORK"

      - name: Download OS4_RODIN.zip and verify
        run: |
          set -euo pipefail
          cd "$WORK"
          curl -L --retry 10 --retry-all-errors --retry-delay 15 --connect-timeout 60 \
            --max-time 3600 -o OS4_RODIN.zip \
            "https://pixeldrain.com/api/file/2sGnr5Ee?download"
          ls -l OS4_RODIN.zip
          echo "f28432d5fb295508375cd3c2833afcfaa99223b5105a7a77bf99edf872adf2cd  OS4_RODIN.zip" | sha256sum -c -
          unzip -Z1 OS4_RODIN.zip | wc -l
          unzip -Z1 OS4_RODIN.zip | grep -c '^images/super\.img\.'
          df -h / "$WORK"

      - name: Extract everything except super chunks
        run: |
          set -euo pipefail
          cd "$WORK"
          mkdir -p OS4_RODIN_no_super
          unzip -q OS4_RODIN.zip -x 'images/super.img.*' -d OS4_RODIN_no_super
          test -z "$(find OS4_RODIN_no_super -name 'super.img.*' -print -quit)"
          find OS4_RODIN_no_super -type f | wc -l
          du -sh OS4_RODIN_no_super
          find OS4_RODIN_no_super -type f -printf '%s %p\n' | sort -nr | head -30
          df -h / "$WORK"

      - name: Reassemble super.img from 54 sparse chunks
        run: |
          set -euo pipefail
          cd "$WORK"
          : > super.img
          for i in $(seq 0 53); do
            echo "chunk $i"
            unzip -p OS4_RODIN.zip "images/super.img.$i" > chunk.sparse
            python3 "$GITHUB_WORKSPACE/tools/extract_raw.py" chunk.sparse super.img
            rm -f chunk.sparse
            if [ $((i % 10)) -eq 0 ]; then df -h "$WORK"; fi
          done
          ls -l super.img
          test "$(stat -c%s super.img)" = "11811160064"
          sha256sum super.img | tee super.sha256
          file super.img || true
          df -h / "$WORK"

      - name: Delete source zip and dump super metadata
        run: |
          set -euo pipefail
          cd "$WORK"
          rm -f OS4_RODIN.zip
          "$GITHUB_WORKSPACE/tools/lptools/lpdump" super.img | tee lpdump.txt
          grep -E 'Name: (vendor|odm|vendor_dlkm|odm_dlkm|system_dlkm)_a' lpdump.txt
          df -h / "$WORK"

      - name: Extract vendor, odm and dlkm partitions
        run: |
          set -euo pipefail
          cd "$WORK"
          mkdir -p OS4_RODIN_no_super/extracted_from_super
          "$GITHUB_WORKSPACE/tools/lptools/lpunpack" \
            -p vendor_a -p odm_a -p vendor_dlkm_a -p odm_dlkm_a -p system_dlkm_a \
            super.img OS4_RODIN_no_super/extracted_from_super/
          cd OS4_RODIN_no_super/extracted_from_super
          ls -l
          for f in *_a.img; do
            [ -e "$f" ] || continue
            mv "$f" "${f%_a.img}.img"
          done
          for f in vendor.img odm.img vendor_dlkm.img odm_dlkm.img system_dlkm.img; do
            test -s "$f"
            echo "OK $f $(stat -c%s "$f")"
            file "$f" || true
          done
          cd "$WORK"
          mv lpdump.txt OS4_RODIN_no_super/
          mv super.sha256 OS4_RODIN_no_super/
          rm -f super.img
          df -h / "$WORK"

      - name: Write README and checksums
        run: |
          set -euo pipefail
          cd "$WORK"
          cat > OS4_RODIN_no_super/README.txt <<'EOF'
          OS4 RODIN (OS4_RODIN.zip) — كل شيء ما عدا super.img
          =====================================================
          
          المصدر / Source:
            https://pixeldrain.com/u/2sGnr5Ee
            OS4_RODIN.zip
            SHA-256: f28432d5fb295508375cd3c2833afcfaa99223b5105a7a77bf99edf872adf2cd
          
          المحتوى / Contents:
            1) جميع ملفات الروم الأصلية ما عدا أجزاء super.img.0 .. super.img.53
               All original ROM files except the super.img.0 .. super.img.53 chunks.
            2) أقسام مستخرجة من super.img (slot A):
               Partitions extracted from super.img (slot A):
                 extracted_from_super/vendor.img
                 extracted_from_super/odm.img
                 extracted_from_super/vendor_dlkm.img
                 extracted_from_super/odm_dlkm.img
                 extracted_from_super/system_dlkm.img
            3) lpdump.txt: جدول أقسام super الأصلي.
            4) super.sha256: بصمة صورة super الخام التي أُعيد تجميعها (11,811,160,064 بايت).
          
          ملاحظة:
            super.img الأصلي لم يُضمَّن. تم تجميع بيانات RAW الجديدة فقط من
            الأجزاء sparse التراكمية وعددها 54، ثم استخراج الأقسام المطلوبة.
            الصورة الخام الكاملة كانت: 11,811,160,064 بايت.
          
            The original super.img is NOT included. Only the new RAW payload
            from each of the 54 cumulative sparse chunks was concatenated, then
            only the requested partitions were extracted.
          
          تحقق / Verify:
            sha256sum -c SHA256SUMS.txt
          EOF
          cd OS4_RODIN_no_super
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          wc -l SHA256SUMS.txt
          du -sh .
          cd "$WORK"

      - name: Compress with 7z maximum
        run: |
          set -euo pipefail
          cd "$WORK"
          NAME="OS4_RODIN_no_super_vendor_odm_dlkm.7z"
          7z a -t7z -m0=lzma2:d=256m:fb=273:mf=bt4:mc=48 -mx=9 -ms=on -mmt=3 \
            "$NAME" OS4_RODIN_no_super
          7z t "$NAME"
          ls -l "$NAME"
          sha256sum "$NAME" | tee sums.txt
          md5sum "$NAME" | tee -a sums.txt
          df -h / "$WORK"

      - name: Upload to Pixeldrain
        env:
          PD_KEY: ${{ secrets.PD_KEY }}
        run: |
          set -euo pipefail
          cd "$WORK"
          NAME="OS4_RODIN_no_super_vendor_odm_dlkm.7z"
          RESP="$(curl -sS --fail-with-body --retry 5 --retry-all-errors --connect-timeout 60 \
            --max-time 7200 -T "$NAME" -u ":$PD_KEY" \
            "https://pixeldrain.com/api/file/$NAME")"
          echo "$RESP" | jq '{success,id,name,size,hash_sha256}'
          ID="$(echo "$RESP" | jq -r '.id')"
          test -n "$ID" -a "$ID" != "null"
          echo "https://pixeldrain.com/u/$ID" | tee link.txt
          curl -sS -u ":$PD_KEY" "https://pixeldrain.com/api/file/$ID/info" \
            | jq '{id,name,size,hash_sha256,availability,can_download}'
          {
            echo "## OS4 RODIN — no super + vendor/odm/dlkms"
            echo ""
            echo "- Link: https://pixeldrain.com/u/$ID"
            echo "- Archive: $NAME"
            echo "- Size: $(stat -c%s "$NAME") bytes"
            echo "- SHA-256: $(sha256sum "$NAME" | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
